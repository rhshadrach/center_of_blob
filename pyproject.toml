[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "center_of_blob"
authors = [
    {name = "Richard Shadrach", email = "rhshadrach@gmail.com"},
]
description = "Center of Blob"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "imageio",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "PyQt5",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "shapely",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {file = "center_of_blob/VERSION"}

[dependency-groups]
lint = [
    "prek",
    "ty",
    "vulture",
    # type-stubs
    "PyQt5-stubs",
]
exe = ["pyinstaller"]
test = ["pytest", "pytest-qt", "pytest-xvfb", "pytest-xdist"]
dev = [
    {include-group = "lint"},
    {include-group = "exe"},
    {include-group = "test"},
]

[tool.pytest.ini_options]
addopts = "-n auto"

[tool.ty.rules]
# PyQt5-stubs names override parameters `a0`, `ev`, etc.; Qt only ever passes them
# positionally, so the parameter-name mismatch is not a real error.
invalid-method-override = "ignore"
