[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cellcensus"
authors = [
    {name = "Richard Shadrach", email = "rhshadrach@gmail.com"},
]
description = "Mark and count blob centers, such as cells, in multichannel microscopy images"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "imageio",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow>=13",
    "PyQt5",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "shapely",
]
dynamic = ["version"]

[project.scripts]
cellcensus = "cellcensus.main:run"

[tool.setuptools.dynamic]
version = {file = "cellcensus/VERSION"}

[dependency-groups]
lint = [
    "prek",
    "ty",
    "vulture",
    # type-stubs
    "PyQt5-stubs",
    # ty needs the test dependencies to resolve imports in tests/.
    {include-group = "test"},
]
exe = ["pyinstaller"]
test = ["pytest", "pytest-qt", "pytest-xvfb", "pytest-xdist"]
dev = [
    {include-group = "lint"},
    {include-group = "exe"},
    {include-group = "test"},
]

[tool.uv]
# The lock is shared by all platforms; make sure it installs on the Windows
# runner that builds the exe. pyqt5-qt5 only has Windows wheels for 5.15.2.
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.pytest.ini_options]
addopts = "-n auto"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.ty.rules]
# PyQt5-stubs names override parameters `a0`, `ev`, etc.; Qt only ever passes them
# positionally, so the parameter-name mismatch is not a real error.
invalid-method-override = "ignore"
