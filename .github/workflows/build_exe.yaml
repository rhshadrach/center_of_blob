name: Build EXE

on:
  push:
    branches:
      - main
    paths: &build-paths
      - cellcensus/**
      - pyproject.toml
      - uv.lock
      - make_exe.bat
      - examples/**
      - .github/actions/setup/**
      - .github/workflows/build_exe.yaml
  pull_request:
    branches:
      - main
    paths: *build-paths
  # Called by release.yaml to build the exe attached to a release.
  workflow_call:

permissions:
  contents: read

env:
  EXAMPLE: SC 20x Pax2-NeuN-Sall3 GS.01 1A s02

jobs:
  build_exe:
    name: build_exe
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Setup
        uses: $/.github/actions/setup
        with:
          groups: exe

      - name: Build exe
        run: uv run cmd /c make_exe.bat

      - name: Smoke test exe
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\CellCensus_*.exe).FullName
          & $exe --smoke-test "examples\$env:EXAMPLE.tif" "examples\$env:EXAMPLE.csv"

      - name: Upload exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cellcensus-exe
          path: dist/CellCensus_*.exe
          if-no-files-found: error

  smoke_test:
    # Runs the uploaded exe on a runner where nothing was built or installed,
    # to catch dependencies on the build machine.
    name: smoke_test (fresh runner)
    needs: build_exe
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-smoke_test
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: examples

      - name: Download exe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cellcensus-exe
          path: dist

      - name: Smoke test exe
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\CellCensus_*.exe).FullName
          & $exe --smoke-test "examples\$env:EXAMPLE.tif" "examples\$env:EXAMPLE.csv"
