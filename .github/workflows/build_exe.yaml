name: Build EXE

on:
  push:
    branches:
      - main
    paths: &build-paths
      - cellcensus/**
      - pyproject.toml
      - uv.lock
      - make_exe.bat
      - .github/actions/setup/**
      - .github/workflows/build_exe.yaml
  pull_request:
    branches:
      - main
    paths: *build-paths

permissions:
  contents: read

jobs:
  build_exe:
    name: build_exe
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Setup
        uses: $/.github/actions/setup
        with:
          groups: exe

      - name: Build exe
        run: uv run cmd /c make_exe.bat

      - name: Upload exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cellcensus-exe
          path: dist/CellCensus_*.exe
          if-no-files-found: error
