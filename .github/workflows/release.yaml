name: Release

# Run from the Actions tab on main. Builds the wheel and Windows exe, checks
# both, and creates a draft release with them attached; publish it from the
# Releases page, which also creates the tag.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXAMPLE: SC 20x Pax2-NeuN-Sall3 GS.01 1A s02

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read and check version
        id: version
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not $REF."
            exit 1
          fi
          version=$(tr -d '[:space:]' < cellcensus/VERSION)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists; bump cellcensus/VERSION first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  wheel:
    name: wheel
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup
        uses: $/.github/actions/setup
        with:
          system-dependencies: true

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke test wheel
        # Install into a clean environment, so this checks the wheel itself.
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-test"
          VIRTUAL_ENV="$RUNNER_TEMP/wheel-test" uv pip install dist/*.whl
          "$RUNNER_TEMP/wheel-test/bin/cellcensus" --smoke-test \
            "examples/$EXAMPLE.tif" "examples/$EXAMPLE.csv"

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cellcensus-wheel
          path: dist/*.whl
          if-no-files-found: error

  exe:
    name: exe
    needs: version
    uses: $/.github/workflows/build_exe.yaml

  release:
    name: draft release
    needs: [version, wheel, exe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Needed to create the release.
      contents: write
    steps:
      - name: Download wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cellcensus-wheel
          path: dist

      - name: Download exe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cellcensus-exe
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
