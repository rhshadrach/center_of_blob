name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    # Python 3.15 is a pre-release and most dependencies lack wheels for it.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    concurrency:
      # https://github.community/t/concurrecy-not-work-for-push/183068/7
      group: ${{ github.event_name == 'push' && github.run_number || github.ref }}-tests-${{ matrix.python-version }}
      cancel-in-progress: true
    steps:
      - name: Setup
        uses: $/.github/actions/setup
        with:
          groups: test
          python-version: ${{ matrix.python-version }}
          system-dependencies: true

      - name: Run tests
        env:
          QT_DEBUG_PLUGINS: 1
        run: |
          ulimit -c unlimited
          uv run pytest tests --durations 20
