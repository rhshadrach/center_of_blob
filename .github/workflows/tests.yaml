name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Setup
        uses: $/.github/actions/setup
        with:
          groups: test
          python-version: ${{ matrix.python-version }}
          system-dependencies: true

      - name: Run tests
        env:
          QT_DEBUG_PLUGINS: 1
        run: |
          ulimit -c unlimited
          uv run pytest tests --durations 20
