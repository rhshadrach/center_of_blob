name: Setup
description: Setup environment for workflows

inputs:
  groups:
    description: Space-separated dependency groups to install, e.g. "test" or "lint exe".
    required: false
    default: ""
  python-version:
    description: Python version to install.
    required: false
    default: "3.10"
  system-dependencies:
    description: Install the Qt system packages needed to run the GUI (Linux only).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install system dependencies
      if: inputs.system-dependencies == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pyqt5-dev-tools

    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      shell: bash
      env:
        DEPENDENCY_GROUPS: ${{ inputs.groups }}
      run: |
        # uv installs the `dev` group by default; only install what was requested.
        args=(--no-default-groups)
        for group in $DEPENDENCY_GROUPS; do
          args+=(--group "$group")
        done
        uv sync --locked "${args[@]}"
